[package]
name = "encoding-core"
version = "0.1.0"
edition = "2024"

[dependencies]
p3-baby-bear = { path = "../source/p3/baby-bear" }
p3-binary-dft = { path = "../source/p3/binary-dft", features = ["parallel"] }
p3-binary-field = { path = "../source/p3/binary-field", features = ["parallel"] }
p3-binary-qa = { path = "../source/p3/binary-qa", features = ["parallel"] }
p3-commit = { path = "../source/p3/commit" }
p3-dft = { path = "../source/p3/dft", features = ["parallel"] }
p3-field = { path = "../source/p3/field" }
p3-goldilocks = { path = "../source/p3/goldilocks" }
p3-matrix = { path = "../source/p3/matrix" }
hyperfold-pcs = { path = "../source/hyperfold" }
binary-hyperfold = { path = "../source/binary-hyperfold", default-features = false, features = ["parallel"] }
rand = "0.10"
rayon = "1.12"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
